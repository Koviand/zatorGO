openapi: 3.0.3
info:
  title: ZatorGO HTTP API
  version: "0.1.44"
  description: |
    Ручная схема ключевых payload'ов (RM0d). Канонические пути `/api/*`;
    алиасы `/cgi-bin/<name>.cgi`. Полное описание — docs/API.md.
servers:
  - url: http://127.0.0.1:17682
    description: Web UI по умолчанию
tags:
  - name: core
  - name: wave0
paths:
  /api/login:
    post:
      tags: [core]
      summary: Вход (ротация session)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: OK + Set-Cookie zator_session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/capabilities:
    get:
      tags: [wave0]
      summary: Версия и флаги фич
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /api/state:
    get:
      tags: [core]
      summary: Агрегат для UI
      parameters:
        - name: scope
          in: query
          schema: { type: string, default: default }
        - name: include
          in: query
          description: "capabilities,journal,health — через запятую"
          schema: { type: string }
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/State"
  /api/status:
    get:
      tags: [core]
      summary: Статус / профили / локи
      parameters:
        - name: scope
          in: query
          schema: { type: string, default: default }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /api/events:
    get:
      tags: [wave0]
      summary: Long-poll событий
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, default: 0 }
        - name: timeout
          in: query
          description: Секунды ожидания (0=сразу, default 25, max 55)
          schema: { type: integer, default: 25 }
        - name: type
          in: query
          schema: { type: string, example: supersweep }
      responses:
        "200":
          description: События
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Events"
  /api/repair:
    post:
      tags: [wave0]
      summary: Узкий ремонт профиля
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { type: integer, minimum: 1, maximum: 10 }
                mode:
                  type: string
                  enum: [auto, relock, recommendations, sweep]
                  default: auto
                scope: { type: string, default: default }
                top_k: { type: integer, default: 1 }
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repair"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/check:
    get:
      tags: [core]
      summary: Сетевая проверка (одиночная или batch)
      parameters:
        - name: profile
          in: query
          schema: { type: integer }
        - name: profiles
          in: query
          description: "Batch: 1,2,4 → {ok,checks:[]}"
          schema: { type: string, example: "1,2" }
        - name: scope
          in: query
          schema: { type: string, default: default }
      responses:
        "200":
          description: Check или BatchCheck
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Check"
                  - $ref: "#/components/schemas/BatchCheck"
  /api/set-lock:
    post:
      tags: [core]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [profile, strategy]
              properties:
                profile: { type: string }
                strategy: { type: integer }
                scope: { type: string, default: default }
      responses:
        "200":
          description: Lock result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockResult"
  /api/settings:
    get:
      tags: [core]
      summary: Чтение setting
      parameters:
        - name: setting
          in: query
          required: true
          schema:
            type: string
            description: >
              Имя секции (неполный enum): supersweep, bypass_flags, strategy_journal,
              recommendations, update_check, auto_relock, ports, tls_blob, hostlist, …
      responses:
        "200":
          description: Payload зависит от setting
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Supersweep"
                  - type: object
    post:
      tags: [core]
      summary: Запись setting / action
      description: >
        Мутации через setting=… (toggles, recommendations_apply, fix_discord,
        strategies_feed, sweep_broken, scope_preset, scope_copy_locks, …).
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [setting]
              properties:
                setting: { type: string }
                value: { type: string }
                profile: { type: string }
                top_k: { type: string }
                preset: { type: string }
      responses:
        "200":
          description: Apply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apply"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: busy (supersweep/relock) или conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/logout:
    post:
      tags: [core]
      summary: Выход (ротация session)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /api/clear-lock:
    post:
      tags: [core]
      summary: Сброс лока профиля
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { type: string }
                scope: { type: string, default: default }
      responses:
        "200":
          description: Clear result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockResult"
  /api/service:
    post:
      tags: [core]
      summary: Управление службой zapret2
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, stop, restart]
      responses:
        "200":
          description: Service result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/domains:
    get:
      tags: [core]
      summary: Списки доменов / explain
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [explain, refresh_ips, refresh_check]
          description: Без action — сводка списков; explain требует domain=
        - name: list
          in: query
          schema: { type: string }
        - name: domain
          in: query
          schema: { type: string }
          description: Для action=explain
      responses:
        "200":
          description: Domains payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [core]
      summary: Изменение списков доменов
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: add, remove, set, clear, import, …
                list: { type: string }
                content: { type: string }
                url: { type: string, description: "import по URL (SSRF-checked)" }
      responses:
        "200":
          description: Apply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apply"
  /api/backups:
    get:
      tags: [core]
      summary: Список / скачивание бэкапов
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [list, download]
        - name: name
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Backups list или файл
    post:
      tags: [core]
      summary: create / delete / restore / upload
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [create, delete, restore, upload]
                name: { type: string }
                mode:
                  type: string
                  enum: [smart, lists, full]
      responses:
        "200":
          description: Backup op result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/scopes:
    get:
      tags: [core]
      summary: Client scopes (чтение)
      responses:
        "200":
          description: Scopes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [core]
      summary: Client scopes (чтение; GET≡POST)
      description: >
        Мутации scopes — через /api/settings
        (setting=client_scope|scope_preset|scope_copy_locks), не через этот путь.
      responses:
        "200":
          description: Тот же payload, что у GET
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/blob-upload:
    post:
      tags: [core]
      summary: Загрузка TLS/WG blob
      description: >
        Канон — application/octet-stream (+ query/header kind).
        multipart/form-data поддерживается опционально.
      parameters:
        - name: kind
          in: query
          schema: { type: string }
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                kind: { type: string }
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Envelope ошибки
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
    Error:
      type: object
      required: [ok, error, code]
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }
        code:
          type: string
          enum:
            - unauthorized
            - csrf
            - conflict
            - busy
            - validation
            - not_found
            - rate_limit
            - unavailable
            - timeout
            - internal
            - method_not_allowed
            - forbidden
        detail: { type: string }
    Capabilities:
      type: object
      properties:
        ok: { type: boolean }
        version: { type: string }
        goos: { type: string }
        goarch: { type: string }
        auth_required: { type: boolean }
        features:
          type: object
          additionalProperties: true
        endpoints:
          type: array
          items: { type: string }
    Status:
      type: object
      properties:
        zapret2_running: { type: boolean }
        profiles:
          type: array
          items:
            type: object
            properties:
              profile: {}
              label: { type: string }
              current_lock: { type: string }
              lock_source: { type: string }
              lock_origin: { type: string }
              max_strategy: { type: integer }
        health:
          type: object
          additionalProperties: true
    State:
      type: object
      properties:
        auth_required: { type: boolean }
        status: { $ref: "#/components/schemas/Status" }
        version: { type: object, additionalProperties: true }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        journal: { type: object, additionalProperties: true }
      additionalProperties: true
    Events:
      type: object
      properties:
        ok: { type: boolean }
        mode: { type: string, example: long-poll }
        after: { type: integer, format: int64 }
        seq: { type: integer, format: int64 }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              state: { type: string }
              profile: { type: integer }
              message: { type: string }
              ts: { type: integer, format: int64 }
    Repair:
      type: object
      properties:
        ok: { type: boolean }
        started: { type: boolean }
        mode: { type: string }
        previous_lock: { type: string }
        scope: { type: string }
        profile: { type: integer }
        async: { type: boolean }
    Check:
      type: object
      properties:
        results:
          type: array
          items: { type: object, additionalProperties: true }
        profile: { type: integer }
        scope: { type: string }
        lock: { type: string }
        zapret2_running: { type: boolean }
    BatchCheck:
      type: object
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
    LockResult:
      type: object
      properties:
        ok: { type: boolean }
        previous: { type: string }
        lock: { type: string }
        changed: { type: boolean }
        scope: { type: string }
        profile: { type: integer }
    Apply:
      type: object
      properties:
        ok: { type: boolean }
        restarted: { type: boolean }
        restart_required: { type: boolean }
        warning: { type: string }
      additionalProperties: true
    Supersweep:
      type: object
      properties:
        available: { type: boolean }
        state:
          type: string
          enum: [idle, starting, running, applying, done, cancelled, interrupted]
        active: { type: boolean }
        source: { type: string, enum: [none, live, saved] }
        started: { type: integer }
        updated: { type: integer }
        completed: { type: integer }
        total: { type: integer }
        scope: { type: string }
        phase: { type: string }
        workers: { type: array, items: { type: object, additionalProperties: true } }
        applied: { type: array, items: { type: object, additionalProperties: true } }
        domains: { type: array, items: { type: object, additionalProperties: true } }
