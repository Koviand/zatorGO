name: ci

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Fuzz ValidateSourceSafe (short)
        run: go test ./internal/config/ -fuzz=FuzzValidateSourceSafe -fuzztime=15s
      - name: Build all release architectures
        run: |
          set -euo pipefail
          # Тот же набор, что scripts/crossbuild.sh / release.yml
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /tmp/zator-arm ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/zator-arm64 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -o /tmp/zator-mips ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=mips64 GOMIPS64=softfloat go build -o /tmp/zator-mips64 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -o /tmp/zator-mipsel ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=mips64le GOMIPS64=softfloat go build -o /tmp/zator-mipsel64 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=ppc64 go build -o /tmp/zator-ppc ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -o /tmp/zator-x86 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/zator-x86_64 ./cmd/zator
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -o /tmp/zator-riscv64 ./cmd/zator

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui-src/package-lock.json
      - name: Install webui deps
        working-directory: webui-src
        run: npm ci
      - name: Typecheck
        working-directory: webui-src
        run: npm run check
      - name: Build
        working-directory: webui-src
        run: npm run build
      - name: Embedded assets match build
        run: |
          # Игнорируем CRLF: коммит с Windows не должен валить Linux CI.
          if ! git diff --ignore-cr-at-eol --exit-code -- assets/webui; then
            echo "assets/webui не совпадает со сборкой (host drift):"
            git status --porcelain -- assets/webui
            git diff --ignore-cr-at-eol -- assets/webui | head -n 200
            echo ""
            echo "How-to: на Linux — cd webui-src && npm ci && npm run build && закоммитьте assets/webui/;"
            echo "  или скачайте artifact webui-assets из release/CI workflow и замените assets/webui/."
            echo "  Windows CRLF игнорируется (--ignore-cr-at-eol); расхождение содержимого — нет."
            exit 1
          fi
