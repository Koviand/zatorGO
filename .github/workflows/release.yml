name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional; публикация только для refs/tags/)"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui-src/package-lock.json
      - name: Web UI check + build
        working-directory: webui-src
        run: |
          npm ci
          npm run check
          npm run build
      - name: Embedded assets match build
        run: |
          if [ -n "$(git status --porcelain -- assets/webui)" ]; then
            echo "assets/webui не совпадает со сборкой:"
            git status --porcelain -- assets/webui
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm
            goarm: "7"
            name: arm
          - goarch: arm64
            name: arm64
          - goarch: mips
            gomips: softfloat
            name: mips
          - goarch: mips64
            gomips64: softfloat
            name: mips64
          - goarch: mipsle
            gomips: softfloat
            name: mipsel
          - goarch: mips64le
            gomips64: softfloat
            name: mipsel64
          - goarch: ppc64
            name: ppc
          - goarch: "386"
            name: x86
          - goarch: amd64
            name: x86_64
          - goarch: riscv64
            name: riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/AloofLibra/zator.versionOverride=${ver}" \
            -o "dist/zator-linux-${{ matrix.name }}" ./cmd/zator
          sha256sum "dist/zator-linux-${{ matrix.name }}" | tee "dist/zator-linux-${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: zator-linux-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Pack release files
        env:
          ZATOR_RELEASE_SIGNING_KEY: ${{ secrets.ZATOR_RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p out
          find artifacts -type f -name 'zator-linux-*' -exec cp {} out/ \;
          cp scripts/zator-launcher.sh out/
          (cd out && sha256sum zator-linux-* zator-launcher.sh > SHA256SUMS)
          if [ -z "${ZATOR_RELEASE_SIGNING_KEY:-}" ]; then
            echo "ZATOR_RELEASE_SIGNING_KEY не задан — публикация без SHA256SUMS.sig запрещена" >&2
            exit 1
          fi
          go run ./scripts/sign-sha256sums.go -in out/SHA256SUMS -out out/SHA256SUMS.sig
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          make_latest: true
