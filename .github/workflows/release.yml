name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional; публикация только для refs/tags/)"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-src/package-lock.json
      - name: Web UI check + build
        working-directory: webui-src
        run: |
          npm ci
          npm run check
          npm run build
      # Жёсткую сверку assets/webui с git не делаем: бинарники ниже
      # вшивают свежую Linux-сборку из артефакта webui-assets.

  webui-assets:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui-src/package-lock.json
      - name: Build Web UI
        working-directory: webui-src
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-assets
          path: assets/webui/

  build:
    needs: [test, webui-assets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm
            goarm: "7"
            name: arm
          - goarch: arm64
            name: arm64
          - goarch: mips
            gomips: softfloat
            name: mips
          - goarch: mips64
            gomips64: softfloat
            name: mips64
          - goarch: mipsle
            gomips: softfloat
            name: mipsel
          - goarch: mips64le
            gomips64: softfloat
            name: mipsel64
          - goarch: ppc64
            name: ppc
          - goarch: "386"
            name: x86
          - goarch: amd64
            name: x86_64
          - goarch: riscv64
            name: riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: webui-assets
          path: assets/webui
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          # Tag v0.1.43 → version 0.1.43 (как Makefile / файл VERSION).
          ref="${GITHUB_REF_NAME:-dev}"
          ver="${ref#v}"
          if [ -f VERSION ]; then
            want="$(tr -d ' \t\r\n' < VERSION)"
            if [ "$ver" != "$want" ] && [ "$ref" != "dev" ]; then
              echo "VERSION=$want не совпадает с tag/ref=$ref (ожидалось $want)" >&2
              exit 1
            fi
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/AloofLibra/zator.versionOverride=${ver}" \
            -o "dist/zator-linux-${{ matrix.name }}" ./cmd/zator
          sha256sum "dist/zator-linux-${{ matrix.name }}" | tee "dist/zator-linux-${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: zator-linux-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Pack release files
        env:
          ZATOR_RELEASE_SIGNING_KEY: ${{ secrets.ZATOR_RELEASE_SIGNING_KEY }}
        run: |
          mkdir -p out
          find artifacts -type f -name 'zator-linux-*' -exec cp {} out/ \;
          cp scripts/zator-launcher.sh out/
          # RM6: каталог стратегий обязателен в каждом релизе (даже placeholder).
          if [ ! -f assets/strategies-extra.tsv ]; then
            echo "assets/strategies-extra.tsv отсутствует" >&2
            exit 1
          fi
          cp assets/strategies-extra.tsv out/strategies-extra.tsv
          (cd out && sha256sum zator-linux-* zator-launcher.sh strategies-extra.tsv > SHA256SUMS)
          if [ -z "${ZATOR_RELEASE_SIGNING_KEY:-}" ]; then
            echo "ZATOR_RELEASE_SIGNING_KEY не задан — публикация без подписей запрещена" >&2
            exit 1
          fi
          go run ./scripts/sign-sha256sums.go -in out/SHA256SUMS -out out/SHA256SUMS.sig
          go run ./scripts/sign-sha256sums.go -in out/strategies-extra.tsv -out out/strategies-extra.tsv.sig
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          make_latest: true
