version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /webui-src
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Только minor/patch — major Vue/Vite вручную.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
